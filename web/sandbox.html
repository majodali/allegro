<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allegro Sandbox</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1e1e2e;
    color: #cdd6f4;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    background: #181825;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #313244;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #cba6f7;
  }
  header .mode {
    font-size: 12px;
    color: #6c7086;
    background: #313244;
    padding: 2px 8px;
    border-radius: 4px;
  }

  /* Toolbar */
  .toolbar {
    background: #181825;
    padding: 6px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #313244;
    flex-wrap: wrap;
  }
  button {
    background: #313244;
    color: #cdd6f4;
    border: 1px solid #45475a;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #45475a; }
  button.primary { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }
  button.primary:hover { background: #74c7ec; }
  button.danger { background: #f38ba8; color: #1e1e2e; border-color: #f38ba8; }
  button.danger:hover { background: #eba0ac; }
  select {
    background: #313244;
    color: #cdd6f4;
    border: 1px solid #45475a;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 13px;
  }
  .separator { width: 1px; height: 20px; background: #45475a; }
  .label { font-size: 12px; color: #6c7086; }

  /* Main panels */
  .panels {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .panel-header {
    background: #181825;
    padding: 4px 12px;
    font-size: 12px;
    color: #6c7086;
    border-bottom: 1px solid #313244;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .panel:first-child { border-right: 1px solid #313244; }

  /* Editor */
  #editor {
    flex: 1;
    background: #1e1e2e;
    color: #cdd6f4;
    font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
    font-size: 14px;
    line-height: 1.5;
    padding: 12px;
    border: none;
    outline: none;
    resize: none;
    tab-size: 4;
    white-space: pre;
    overflow: auto;
  }

  /* Output */
  #output {
    flex: 1;
    font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
    font-size: 14px;
    line-height: 1.5;
    padding: 12px;
    overflow: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .out-line { color: #a6e3a1; }
  .out-result { color: #89b4fa; }
  .out-error { color: #f38ba8; }
  .out-info { color: #6c7086; font-style: italic; }

  /* Status bar */
  footer {
    background: #181825;
    padding: 4px 16px;
    font-size: 11px;
    color: #6c7086;
    border-top: 1px solid #313244;
    display: flex;
    justify-content: space-between;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .panels { flex-direction: column; }
    .panel:first-child { border-right: none; border-bottom: 1px solid #313244; }
  }
</style>
</head>
<body>

<header>
  <h1>Allegro Sandbox</h1>
  <span class="mode">Allegro Standard</span>
</header>

<div class="toolbar">
  <button class="primary" onclick="runCode()" title="Ctrl+Enter">Run</button>
  <button onclick="resetSession()">Reset</button>
  <div class="separator"></div>
  <span class="label">Examples:</span>
  <select id="examples" onchange="loadExample()">
    <option value="">— select —</option>
  </select>
  <div class="separator"></div>
  <span class="label">Snippets:</span>
  <select id="snippets" onchange="loadSnippet()">
    <option value="">— select —</option>
  </select>
  <button onclick="saveSnippet()">Save</button>
  <button class="danger" onclick="deleteSnippet()">Delete</button>
</div>

<div class="panels">
  <div class="panel">
    <div class="panel-header">Editor</div>
    <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off">// Welcome to the Allegro Sandbox!
// Press Ctrl+Enter or click Run to evaluate.

print("Hello, Allegro!")
</textarea>
  </div>
  <div class="panel">
    <div class="panel-header">Output</div>
    <div id="output"><span class="out-info">Press Run to evaluate...</span></div>
  </div>
</div>

<footer>
  <span id="status">Ready</span>
  <span>Allegro Standard | Web Sandbox</span>
</footer>

<script src="dist/allegro.js"></script>
<script>
// =============================================================================
// Sandbox Logic
// =============================================================================


// --- BEGIN LIB REGISTRY (generated by scripts/sync-web-libs.ts — do not edit by hand) ---
Allegro.registerLibrary('pow', `// Grammar-extension module: adds the \`**\` exponentiation operator and the
// \`neg\` prefix keyword. Files that \`use pow\` (or \`use import pow\`) get
// these syntactic additions before parsing.

// Helper: integer exponentiation by repeated multiplication.
pow_helper(base, n, acc) =>
  if n == 0
    then acc
    else pow_helper(base, n - 1, acc * base)

pow_int(base, n) => pow_helper(base, n, 1)

// Grammar additions. \`pow_grammar\` is the exported Grammar value; the
// \`use pow\` pre-scanner picks up any Grammar-valued binding in the module.
//
// Precedence: \`**\` sits between multiplication and unary — binds tighter
// than \`*\` / \`/\`, looser than \`-x\`. Right-associative so \`a ** b ** c\`
// parses as \`a ** (b ** c)\`.
pow_grammar = grammar {
  infix "**" prec(pow) above(mul) below(unary) right => (l, r) => pow_int(l, r)
  expr_prefix "neg" => x => 0 - x
}
`);
Allegro.registerLibrary('match_expr', `// Grammar-extension module: adds a \`match\` expression.
//
//   match scrutinee with
//     p1 => e1
//     p2 => e2
//     p3 => e3
//
// desugars to a linear search: compare scrutinee against each pattern's
// expression value; when equal, return the corresponding result. If no
// match, returns an error.
//
// Patterns here are plain expression atoms (not the full pattern grammar
// of when/is/then). For \`match_wildcard\`, bind a pattern to any value by
// using any fresh identifier — it won't match equality against anything
// real, so put the intended catch-all clause last using a boolean
// \`true\` as the pattern plus always-true equality check.

match_helper(scrutinee, cases, idx) =>
  if idx == cases.length
    then error "match: no branch matched"
    else if scrutinee == cases[idx].p
      then cases[idx].e
      else match_helper(scrutinee, cases, idx + 1)

match_dispatch(scrutinee, cases) =>
  match_helper(scrutinee, cases, 0)

match_grammar = grammar {
  rule match_case = p:expr "=>" e:expr => (p, e) => {p: p, e: e}
  rule match_list = c:match_case ** "|" => c => c

  expr_form "match" s:expr "with" cs:match_list
    => (s, cs) => match_dispatch(s, cs)
}
`);
Allegro.registerLibrary('invariants', `// Allegro Standard Library — Invariants
//
// Phase C of the provability arc: pervasive \`assert\` syntax, implemented as
// a grammar extension on top of the \`assert_stmt\` primitive.
//
// Compile-time discharge piggybacks on Phase B's abstract-domain reasoning
// and Phase C Chunk 1's predicate sets — provable assertions become free at
// runtime; failing ones produce concrete counterexamples; succeeding ones
// add their derived predicates to the bindings' scope-local sets so
// subsequent code inherits the proven facts.
//
// Surface form (added to the host grammar):
//
//     assert <bool-expr>
//
// The condition is a boolean expression that may reference any in-scope
// bindings. Recognised shapes (single-binding comparisons against a literal,
// conjunctions thereof) narrow the relevant bindings' predicate sets within
// the rest of the enclosing scope.
//
// Example:
//
//     y = compute(x)
//     assert y > 0           // narrows y's predicate set to ≥ 1
//     z = y * 2              // z's predicate set inherits ≥ 2 via propagation
//
// Multi-binding / opaque conditions still runtime-check on failure but do
// not narrow individual binding predicates — relational tracking is Phase D.

invariants_grammar = grammar {
  stmt_form "assert" cond:expr
    => cond => assert_stmt(cond)
}
`);
Allegro.registerLibrary('contracts', `// Allegro Standard Library — Contracts
//
// Phase C of the provability arc, Chunk 3: function-body contract clauses.
//
// Two new statement forms attach contracts to a function body:
//
//     requires <bool-expr>           // caller obligation
//     ensures  <bool-expr-with-_>    // implementer guarantee
//
// They lower to bare-expression markers (\`requires_stmt(P)\` / \`ensures_decl(P)\`)
// at the head of the function body. The tree-builder's contract preprocessor
// recognises these markers and rewrites the block:
//
//   - \`requires\` checks fire at function entry (sequenced ahead of the body).
//   - \`ensures\` checks wrap the result: the result is bound to \`_\`, the
//     predicate runs against it, and the result is returned with the proven
//     post-condition attached to its predicate set so callers can see it.
//
// Static discharge: predicate-set entailment short-circuits both directions.
// If the call site's predicates already entail \`requires P\`, the runtime
// check at entry no-ops. If the body's result already carries a set that
// entails \`ensures P\`, the runtime check at exit no-ops. Either way the
// post-condition propagates to the caller.
//
// Surface form:
//
//     divide(a, b) =>
//       requires b != 0
//       ensures _ != 0 || a == 0
//       a / b
//
// \`_\` in \`ensures\` refers to the function's return value, matching the
// refinement-predicate convention (\`Int & _ > 0\`). At parse time the
// preprocessor rewrites \`_\` references inside ensures predicates into a
// one-param lambda over \`_\`, so a single result evaluation feeds every
// post-condition check.
//
// Failures: a violated precondition halts with \`precondition failed: …\`;
// a violated post-condition halts with \`postcondition failed: …\`. In both
// cases the message includes the constraint and (when the value is a 64-bit
// Int) the actual counterexample.

contracts_grammar = grammar {
  stmt_form "requires" cond:expr
    => cond => requires_stmt(cond)
  stmt_form "ensures" cond:expr
    => cond => ensures_decl(cond)
}
`);
Allegro.registerLibrary('effects', `// Allegro Standard Library — Effects (Phase D1)
//
// Function-body effect declarations. Each function may state the
// categories of side effects it can produce; the analyzer infers the
// actual set from the primitives transitively called and verifies the
// declaration is a superset (under-promising is an error).
//
// Surface form (added to the host grammar):
//
//     effects io
//     effects io, net
//     effects pure
//
// Lowers to a parse-time marker that the block-expression preprocessor
// extracts and uses to wrap the function body with \`effects_attach(body,
// labels)\`. At runtime the wrapper is a passthrough; at compile time the
// inference walker peels it to recover the declared set.
//
// Effect labels are extension-provided strings, not a fixed enum. Core
// ships only the implicit \`pure\` (the empty set). Extensions register
// labels alongside the primitives that produce them — the standard
// library's \`print\` carries \`io\`, \`fetch\` carries \`net\`, \`delay\` carries
// \`time\`. Domain-specific extensions register their own (\`build-io\`,
// \`funds-mutation\`, …).
//
// Example:
//
//     use effects
//
//     square(x) =>
//       effects pure
//       x * x
//
//     greet(name) =>
//       effects io
//       print("Hello, " + name)
//       name
//
// See \`previews/d1-effects.alg\` for the full design rationale, including
// the boundary with Phase D2 (parametric capabilities).

effects_grammar = grammar {
  stmt_form "effects" labels:ident ** ","
    => labels => effects_decl_marker(labels)

  // Stage D — Surface C param-bound declaration. Useful when the param has a
  // non-trivial type and you don't want to fold the effect into the type
  // expression. \`param_effects f: pure\` lowers to a marker the block-expr
  // preprocessor extracts; the bound is stamped on the Param at typed_function
  // setup time, identical predicate shape to \`f: pure\` in the param-type slot.
  //
  //   process(arr: Array[Int], f) =>
  //     param_effects f: pure
  //     arr.map(f)
  stmt_form "param_effects" n:ident ":" e:ident
    => (n, e) => param_effects_decl_marker(n, e)
}
`);
Allegro.registerLibrary('units', `// units.alg — units-of-measure DSL, core algebra (B-092 U1).
//
// Dimensions are structural DATA: a 7-exponent vector over the SI base
// dimensions [L, M, T, I, Θ, N, J], an abelian group under elementwise
// exponent addition. Dimension equality is kernel structural equality;
// named dimensions are REFINEMENTS over the one Quantity record — so
// dimensional soundness is refinement discharge, the same machinery as
// PositiveInt (plan: docs/plans/units-dsl.md, U-R1).

// --- Dimension vectors -------------------------------------------------

dimensionless = [0, 0, 0, 0, 0, 0, 0]
length_dim    = [1, 0, 0, 0, 0, 0, 0]
mass_dim      = [0, 1, 0, 0, 0, 0, 0]
time_dim      = [0, 0, 1, 0, 0, 0, 0]
current_dim   = [0, 0, 0, 1, 0, 0, 0]

dim_mul(a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2], a[3] + b[3], a[4] + b[4], a[5] + b[5], a[6] + b[6]]
dim_div(a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2], a[3] - b[3], a[4] - b[4], a[5] - b[5], a[6] - b[6]]
dim_pow(a, n) => [a[0] * n, a[1] * n, a[2] * n, a[3] * n, a[4] * n, a[5] * n, a[6] * n]

velocity_dim     = dim_div(length_dim, time_dim)
acceleration_dim = dim_div(velocity_dim, time_dim)
force_dim        = dim_mul(mass_dim, acceleration_dim)
energy_dim       = dim_mul(force_dim, length_dim)
power_dim        = dim_div(energy_dim, time_dim)
pressure_dim     = dim_div(force_dim, dim_mul(length_dim, length_dim))

// --- Dimension rendering (domain vocabulary for errors) ----------------

dim_sym(i) => ["m", "kg", "s", "A", "K", "mol", "cd"][i]

// B-028 F3: the renderer is UNROLLED over the fixed 7-dimension domain —
// the former count-up recursion was unprovable to the divergence
// analysis, and its inferred \`div\` cascaded through dim_name into the
// arithmetic surface (the pre-declared corpus sweep's one finding).
// Non-recursive = total by construction; output is byte-identical.
dim_piece(d, i) =>
  e = d[i]
  if e == 0
    then ""
    else if e == 1 then dim_sym(i) else dim_sym(i) + "^" + e.toString()

dim_join(a, b) =>
  if a == "" then b else if b == "" then a else a + "·" + b

dim_render(d) =>
  r = dim_join(dim_piece(d, 0),
      dim_join(dim_piece(d, 1),
      dim_join(dim_piece(d, 2),
      dim_join(dim_piece(d, 3),
      dim_join(dim_piece(d, 4),
      dim_join(dim_piece(d, 5),
               dim_piece(d, 6)))))))
  if r == "" then "dimensionless" else r

dim_name(d) =>
  when d
    is x and x == length_dim then "length"
    is x and x == mass_dim then "mass"
    is x and x == time_dim then "time"
    is x and x == velocity_dim then "velocity"
    is x and x == acceleration_dim then "acceleration"
    is x and x == force_dim then "force"
    is x and x == energy_dim then "energy"
    is x and x == power_dim then "power"
    is x and x == pressure_dim then "pressure"
    is _ then dim_render(d)

// --- Unit: {name, dim, scale} — scale relative to the coherent SI unit --

wrap_name(n) => if n.includes("·") || n.includes("/") then "(" + n + ")" else n

u_mul(self, other) =>
  if other instanceof Unit
    then Unit(self.name + "·" + wrap_name(other.name), dim_mul(self.dim, other.dim), self.scale * other.scale)
    else error "a unit can only multiply another unit — use qty(n, u) to build a quantity"

u_div(self, other) =>
  if other instanceof Unit
    then Unit(self.name + "/" + wrap_name(other.name), dim_div(self.dim, other.dim), self.scale / other.scale)
    else error "a unit can only divide another unit"

u_pow(self, n) => Unit(wrap_name(self.name) + "^" + n.toString(), dim_pow(self.dim, n), self.scale.pow(n.toFloat()))

u_toString(self) => self.name

Unit = Type.define({
  name: String,
  dim: Array,
  scale: Float,
  mul: u_mul,
  div: u_div,
  pow: u_pow,
  toString: u_toString
})

// Rename a computed unit (N, J, W, …) keeping its dimension and scale.
named(u, n) => Unit(n, u.dim, u.scale)

// --- Quantity: {mag, dim, unit} ----------------------------------------

// Normalized magnitude (in coherent SI terms) — the comparison basis.
q_norm(q) => q.mag * q.unit.scale

q_add(self, other) =>
  if !(other instanceof Quantity)
    then error "cannot add {self.unit.name} and a bare number — wrap it with qty(n, unit)"
    else if self.dim == other.dim
      then Quantity(self.mag + q_norm(other) / self.unit.scale, self.dim, self.unit)
      else error "cannot add {self.unit.name} and {other.unit.name}: {dim_name(self.dim)} vs {dim_name(other.dim)}"

q_sub(self, other) =>
  if !(other instanceof Quantity)
    then error "cannot subtract a bare number from {self.unit.name} — wrap it with qty(n, unit)"
    else if self.dim == other.dim
      then Quantity(self.mag - q_norm(other) / self.unit.scale, self.dim, self.unit)
      else error "cannot subtract {other.unit.name} from {self.unit.name}: {dim_name(self.dim)} vs {dim_name(other.dim)}"

q_mul(self, other) =>
  when other
    is o and o instanceof Quantity then Quantity(self.mag * o.mag, dim_mul(self.dim, o.dim), self.unit.mul(o.unit))
    is o and o instanceof Unit then Quantity(self.mag, dim_mul(self.dim, o.dim), self.unit.mul(o))
    is o and o instanceof Int then Quantity(self.mag * o.toFloat(), self.dim, self.unit)
    is o and o instanceof Float then Quantity(self.mag * o, self.dim, self.unit)
    is _ then error "cannot multiply {self.unit.name} by that value"

q_div(self, other) =>
  when other
    is o and o instanceof Quantity then Quantity(self.mag / o.mag, dim_div(self.dim, o.dim), self.unit.div(o.unit))
    is o and o instanceof Unit then Quantity(self.mag, dim_div(self.dim, o.dim), self.unit.div(o))
    is o and o instanceof Int then Quantity(self.mag / o.toFloat(), self.dim, self.unit)
    is o and o instanceof Float then Quantity(self.mag / o, self.dim, self.unit)
    is _ then error "cannot divide {self.unit.name} by that value"

// Convert to another unit of the SAME dimension.
q_to(self, target) =>
  if !(target instanceof Unit)
    then error "to(...) expects a unit"
    else if self.dim == target.dim
      then Quantity(q_norm(self) / target.scale, self.dim, target)
      else error "cannot convert {self.unit.name} to {target.name}: {dim_name(self.dim)} vs {dim_name(target.dim)}"

q_eq(self, other) =>
  if other instanceof Quantity && self.dim == other.dim
    then q_norm(self) == q_norm(other)
    else false

q_lt(self, other) =>
  if other instanceof Quantity && self.dim == other.dim
    then q_norm(self) < q_norm(other)
    else error "cannot compare {self.unit.name} with an incompatible value"

q_gt(self, other) =>
  if other instanceof Quantity && self.dim == other.dim
    then q_norm(self) > q_norm(other)
    else error "cannot compare {self.unit.name} with an incompatible value"

q_toString(self) => "{self.mag} {self.unit.name}"

// U3: Quantity DRAWS Equatable — its refl/sym/trans law obligations are
// recorded against the custom normalized eq (never silently granted),
// and the E4 proof_trans gate arms over quantities. The algebraic laws
// land at their honest tier: record-domain quantifiers have no sample
// construction yet (B-089 residue), so they are PENDING in the verdict
// — the ledger showing \`?\` is the product, not a blemish (U-R3).
Quantity = Type.define({
  mag: Float,
  dim: Array,
  unit: Unit,
  add: q_add,
  sub: q_sub,
  mul: q_mul,
  div: q_div,
  to: q_to,
  eq: q_eq,
  lt: q_lt,
  gt: q_gt,
  toString: q_toString,
  law_mul_comm: for_all((a, b) => a.mul(b).eq(b.mul(a))),
  law_conv_roundtrip: for_all(a => a.to(a.unit).eq(a))
}, Equatable)

// The blessed constructor: qty(3, m), qty(9.8, m.div(s.pow(2))).
qty(v, u) =>
  mag = when v
    is n and n instanceof Int then n.toFloat()
    is n then n
  Quantity(mag, u.dim, u)

// --- Named dimensions: refinements over Quantity (U-R1) -----------------

Length       = Quantity & _.dim == length_dim
Mass         = Quantity & _.dim == mass_dim
Duration     = Quantity & _.dim == time_dim
Velocity     = Quantity & _.dim == velocity_dim
Acceleration = Quantity & _.dim == acceleration_dim
Force        = Quantity & _.dim == force_dim
Energy       = Quantity & _.dim == energy_dim

// --- SI units (U-R5: mechanics-focused set) -----------------------------

m  = Unit("m",  length_dim, 1.0)
km = Unit("km", length_dim, 1000.0)
cm = Unit("cm", length_dim, 0.01)
mm = Unit("mm", length_dim, 0.001)
s  = Unit("s",  time_dim, 1.0)
minute = Unit("min", time_dim, 60.0)
min    = minute
hour   = Unit("h",   time_dim, 3600.0)
h      = hour
kg = Unit("kg", mass_dim, 1.0)
g  = Unit("g",  mass_dim, 0.001)

N  = named(kg.mul(m).div(s.pow(2)), "N")
J  = named(N.mul(m), "J")
W  = named(J.div(s), "W")
Pa = named(N.div(m.pow(2)), "Pa")

// --- Quantity literal sugar (U2) ---------------------------------------
//
// \`3 m\`, \`9.8 m/s^2\`, \`1.5 km\` — number-anchored (U-R2): only a NUMERIC
// LITERAL followed by a unit expression on the SAME LINE reads as a
// quantity (the explicit \`hws\` keeps the sugar horizontal-only, so
// \`x = 3\` on one line never glues onto an identifier on the next).
// Computed magnitudes use the ordinary algebra: \`qty(v, u)\`, \`q.mul(u)\`.
// Unit expressions: idents, \`·\` or \`*\` products, ONE \`/\`, \`^\` integer
// exponents. The matched unit idents resolve in the CONSUMER's scope —
// \`use units\` provides them; a local rebinding of a unit name shadows it.
units_grammar = grammar {
  rule unit_pow = u:ident "^" e:number   => (u, e) => u.pow(e)
  rule unit_pow += u:ident               => u => u
  rule unit_prod = a:unit_pow "·" b:unit_prod  => (a, b) => a.mul(b)
  rule unit_prod += a:unit_pow "*" b:unit_prod => (a, b) => a.mul(b)
  rule unit_prod += a:unit_pow           => a => a
  rule unit_quot = p:unit_prod "/" q:unit_prod => (p, q) => p.div(q)
  rule unit_quot += p:unit_prod          => p => p

  expr_form f:float hws u:unit_quot  => (f, u) => qty(f, u)
  expr_form n:number hws u:unit_quot => (n, u) => qty(n, u)
}
`);
// --- END LIB REGISTRY ---

const editor = document.getElementById('editor');
const output = document.getElementById('output');
const status = document.getElementById('status');
const examplesSelect = document.getElementById('examples');
const snippetsSelect = document.getElementById('snippets');

// Populate examples dropdown
for (const name of Object.keys(EXAMPLES)) {
  const opt = document.createElement('option');
  opt.value = name;
  opt.textContent = name;
  examplesSelect.appendChild(opt);
}

function loadExample() {
  const name = examplesSelect.value;
  if (name && EXAMPLES[name]) {
    editor.value = EXAMPLES[name];
    examplesSelect.value = '';
  }
}

// --- Snippets (localStorage) ---

const STORAGE_KEY = 'allegro-snippets';

function getSnippets() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch { return {}; }
}

function saveSnippets(snippets) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(snippets));
}

function refreshSnippetsList() {
  const snippets = getSnippets();
  snippetsSelect.innerHTML = '<option value="">— select —</option>';
  for (const name of Object.keys(snippets).sort()) {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    snippetsSelect.appendChild(opt);
  }
}

function saveSnippet() {
  const name = prompt('Snippet name:');
  if (!name) return;
  const snippets = getSnippets();
  snippets[name] = editor.value;
  saveSnippets(snippets);
  refreshSnippetsList();
  status.textContent = `Saved: ${name}`;
}

function loadSnippet() {
  const name = snippetsSelect.value;
  if (!name) return;
  const snippets = getSnippets();
  if (snippets[name]) {
    editor.value = snippets[name];
    snippetsSelect.value = '';
  }
}

function deleteSnippet() {
  const name = snippetsSelect.value;
  if (!name) return;
  if (!confirm(`Delete snippet "${name}"?`)) return;
  const snippets = getSnippets();
  delete snippets[name];
  saveSnippets(snippets);
  refreshSnippetsList();
  snippetsSelect.value = '';
  status.textContent = `Deleted: ${name}`;
}

refreshSnippetsList();

// --- Run ---

async function runCode() {
  const source = editor.value;
  if (!source.trim()) {
    output.innerHTML = '<span class="out-info">Nothing to evaluate.</span>';
    return;
  }

  output.innerHTML = '';
  status.textContent = 'Running...';
  const start = performance.now();

  try {
    const result = await Allegro.evalAsync(source, (text) => {
      output.innerHTML += `<span class="out-line">${escapeHtml(text)}</span>\n`;
    });

    if (result.result !== null && result.result !== undefined) {
      output.innerHTML += `<span class="out-result">${escapeHtml(result.result)}</span>\n`;
    }
    if (result.error) {
      output.innerHTML += `<span class="out-error">Error: ${escapeHtml(result.error)}</span>\n`;
    }
    if (!output.innerHTML) output.innerHTML = '<span class="out-info">No output.</span>';
  } catch (e) {
    output.innerHTML += `<span class="out-error">Error: ${escapeHtml(String(e))}</span>\n`;
  }

  status.textContent = `Evaluated in ${(performance.now() - start).toFixed(0)}ms`;
}

function resetSession() {
  Allegro.reset();
  output.innerHTML = '<span class="out-info">Session reset.</span>';
  status.textContent = 'Session reset';
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// --- Keyboard shortcuts ---

editor.addEventListener('keydown', (e) => {
  // Ctrl+Enter / Cmd+Enter — run
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runCode();
  }

  // Tab — insert spaces
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 4;
  }
});
