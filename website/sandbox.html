PositiveInt = Int & _ > 0
print(PositiveInt(5))                 // 5

double_pos(x: PositiveInt): PositiveInt =>
  requires x > 0
  ensures _ > 0
  x + x
print(double_pos(PositiveInt(7)))     // 14

// Theorems discharge by evaluation at compile time; proofs compose.
theorem four: 2 + 2 == 4
theorem four_flipped: 4 == 2 + 2 by proof_sym(four)
print(2 + 2)                          // 4 — theorems change nothing at runtime`,

  "Walkthrough 2 — Break a claim (counterexamples)": `// Failures name concrete inputs, not type-error hieroglyphs.
SmallPos = Int & _ > 0 & _ < 100
print(SmallPos(50))                   // 50
print(error of SmallPos(0 - 5))       // refinement check failed: expected ≥ 1 (got -5)
print(error of SmallPos(200))         // refinement check failed: expected ≤ 99 (got 200)

// Record invariants tie fields together.
Range = Type.define({lo: Int, hi: Int}) & _.lo <= _.hi
print(error of Range(50, 5))          // refinement check failed

// A FALSE theorem halts the build — uncomment to see the refusal:
// theorem wrong: 2 + 2 == 5
print("still standing")`,

  "Walkthrough 3 — Effects: what code doesn't do": `// Functions declare their side-effect categories; the analyzer infers
// the actual set and verifies declared ⊇ inferred.
use effects

square(x) => x * x                    // inferred: pure
print(square(7))

loud(msg) =>
  effects io
  print(msg)                          // print is tagged io
  msg
loud("declared and verified")

// Under-promising is refused — uncomment to halt the build:
// sneaky(x) =>
//   effects pure
//   print(x)
//   x
print("no undeclared effects")`,

  "Walkthrough 4 — Laws, tiers & the escape hatch": `// No boolean "verified": every law obligation resolves to a TIER,
// and proofs record which tier backed them.
theorem t_int: 1 == 1 by proof_trans(proof_refl(1), proof_refl(1))
p = proof_trans(proof_refl(7), proof_refl(7))
print(p.lawTier)                      // kernel

// A custom equality: its law obligations are recorded, never granted.
Cell = Type.define({x: Int, eq: (self, other) => self.x == other.x}, Equatable)
v = Cell(1)

// proof_trans over Cell is REFUSED until trans is proven or admitted.
// (Try it: move the theorem below above the Law.assume line.)
Law.assume(Cell, "trans")             // legal — and loud

theorem t_cell: v == v by proof_trans(proof_refl(v), proof_refl(v))
q = proof_trans(proof_refl(v), proof_refl(v))
print(q.lawTier)                      // admitted — nothing upgraded for free`,

  "Walkthrough 5 — A provable DSL (units)": `// A provable DSL in ~200 lines of Allegro — zero host code (lib/units.alg).
use units

// Physics theorems discharge at compile time.
theorem km_scale: 1 km == 1000 m
theorem newton_ident: 1 N == 1 kg·m/s^2

// Dimensional soundness is refinement checking — the same machinery
// as PositiveInt, stated in the signature.
force_of(mass: Mass, acc: Acceleration): Force => mass.mul(acc)
f = force_of(2 kg, 9.8 m/s^2)
print(f.to(N).toString())        // 19.6 N
print(f instanceof Force)        // true

// Mismatches speak physics, not type-system jargon.
bad = 3 m + 4 s
print(error of bad)              // cannot add m and s: length vs time

// Laws carry their strength: proof_trans over quantities is REFUSED
// until transitivity is proven or admitted (try: move the theorem
// below above the Law.assume line). Admitting is legal — and loud.
Law.assume(Quantity, "trans")
q = 5 m
theorem chain: q == q by proof_trans(proof_refl(q), proof_refl(q))
p = proof_trans(proof_refl(q), proof_refl(q))
print(p.lawTier)                 // admitted — nothing upgraded for free`,

  "Hello World": `print("Hello, Allegro!")`,

  "Fibonacci": `// Tail-recursive fibonacci
fib(n) => if n < 2 then n else fib(n - 1) + fib(n - 2)
print(fib(10))
print(fib(20))`,

  "Pattern Matching": `// Pattern matching with guards and destructuring
classify(val) => when val
  is n and n > 0 then "positive"
  is n and n < 0 then "negative"
  is _ then "zero"

print(classify(42))
print(classify(0 - 5))
print(classify(0))

// Destructuring
point = {x: 10, y: 20}
when point
  is {x, y} and x > 0 then print("x={x}, y={y}")
  is _ then print("origin")`,

  "Custom Types": `// Define a custom type using the fluent API
Point = Type.define({x: Int, y: Int})
p = Point(10, 20)
print(p)
print(p.x)
print(p instanceof Point)

// Refinement type
PositiveInt = Int & _ > 0
print(PositiveInt(5))
x = PositiveInt(0 - 1)
print(error of x)

// C3.3: instanceof RE-CHECKS the predicate from data (pure, congruent)
print(5 instanceof PositiveInt)
// certificate_peek asks "was it CONSTRUCTED as PositiveInt?" (effectful)
print(certificate_peek(PositiveInt(5), PositiveInt))
print(certificate_peek(5, PositiveInt))

// Distinct type (breaks subtypeof)
UserId = Int.distinct()
print(UserId(42) instanceof Int)
print(UserId(42) instanceof UserId)`,

  "Knowledge Bounds": `// C3.2: annotations are knowledge upper-bounds.
// Passing a Dog through \`a: Animal\` hides Dog-only members
// until a \`when ... is Dog\` type pattern narrows the occurrence.
Animal = Type.define({legs: Int})
Dog = Type.define({legs: Int, tricks: Int}, Animal)

count_legs(a: Animal): Int => a.legs
print(count_legs(Dog(4, 7)))

describe(a: Animal): Int => when a is Dog then a.tricks else 0 - 1
print(describe(Dog(4, 9)))

// a.tricks WITHOUT narrowing would report:
//   'tricks' is not available through annotation 'Animal'`,

  "Arrays": `// Array operations
nums = [1, 2, 3, 4, 5]
print(nums.length)

doubled = nums.map(x => x * 2)
print(doubled)

evens = nums.filter(x => x % 2 == 0)
print(evens)

sum = nums.reduce((acc, x) => acc + x, 0)
print(sum)

// Chaining
result = [1, 2, 3, 4, 5]
  .filter(x => x > 2)
  .map(x => x * 10)
print(result)`,

  "String Interpolation": `name = "World"
print("Hello, {name}!")

x = 6
y = 7
print("{x} * {y} = {x * y}")

// String methods
greeting = "  Hello, Allegro!  "
print(greeting.trim())
print(greeting.trim().toUpperCase())
print("hello".startsWith("hel"))
print("a,b,c".split(","))`,

safeDiv(a, b) =>
  if b == 0
    then error "division by zero"
    else a / b

print(safeDiv(10, 2))
print(safeDiv(10, 0))

// Inspect errors
result = safeDiv(10, 0)
when error of result
  is none then print("ok")
  is msg then print("Error: {msg}")`,

  "Type System": `// Type hierarchy
print(42 instanceof Int)
print("hello" instanceof String)
print(Type subtypeof Type)

// Generics
arr = [1, 2, 3]
print(arr instanceof Array)
print(arr instanceof Array[Int])

// Type annotations
add(x: Int, y: Int): Int => x + y
print(add(3, 4))

// Multi-line expressions
abs(x) =>
  if x > 0
    then x
    else 0 - x
print(abs(0 - 42))`,

  "Recursive Algorithms": `// Recursive map
myMap(arr, f) =>
  if arr.length == 0
    then []
    else [f(arr[0])].concat(myMap(arr.slice(1), f))

print(myMap([1, 2, 3], x => x * 3))

// Recursive filter
myFilter(arr, pred) =>
  if arr.length == 0
    then []
    else if pred(arr[0])
      then [arr[0]].concat(myFilter(arr.slice(1), pred))
      else myFilter(arr.slice(1), pred)

print(myFilter([1, 2, 3, 4, 5], x => x % 2 == 0))

// Recursive reduce (tail-recursive)
myReduce(arr, f, acc) =>
  if arr.length == 0
    then acc
    else myReduce(arr.slice(1), f, f(acc, arr[0]))

print(myReduce([1, 2, 3, 4, 5], (a, b) => a + b, 0))`,
};

// Populate examples dropdown
for (const name of Object.keys(EXAMPLES)) {
  const opt = document.createElement('option');
  opt.value = name;
  opt.textContent = name;
  examplesSelect.appendChild(opt);
}

function loadExample() {
  const name = examplesSelect.value;
  if (name && EXAMPLES[name]) {
    editor.value = EXAMPLES[name];
    examplesSelect.value = '';
  }
}

// --- Snippets (localStorage) ---

const STORAGE_KEY = 'allegro-snippets';

function getSnippets() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch { return {}; }
}

function saveSnippets(snippets) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(snippets));
}

function refreshSnippetsList() {
  const snippets = getSnippets();
  snippetsSelect.innerHTML = '<option value="">— select —</option>';
  for (const name of Object.keys(snippets).sort()) {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    snippetsSelect.appendChild(opt);
  }
}

function saveSnippet() {
  const name = prompt('Snippet name:');
  if (!name) return;
  const snippets = getSnippets();
  snippets[name] = editor.value;
  saveSnippets(snippets);
  refreshSnippetsList();
  status.textContent = `Saved: ${name}`;
}

function loadSnippet() {
  const name = snippetsSelect.value;
  if (!name) return;
  const snippets = getSnippets();
  if (snippets[name]) {
    editor.value = snippets[name];
    snippetsSelect.value = '';
  }
}

function deleteSnippet() {
  const name = snippetsSelect.value;
  if (!name) return;
  if (!confirm(`Delete snippet "${name}"?`)) return;
  const snippets = getSnippets();
  delete snippets[name];
  saveSnippets(snippets);
  refreshSnippetsList();
  snippetsSelect.value = '';
  status.textContent = `Deleted: ${name}`;
}

refreshSnippetsList();

// --- Run ---

async function runCode() {
  const source = editor.value;
  if (!source.trim()) {
    output.innerHTML = '<span class="out-info">Nothing to evaluate.</span>';
    return;
  }

  output.innerHTML = '';
  status.textContent = 'Running...';
  const start = performance.now();

  try {
    const result = await Allegro.evalAsync(source, (text) => {
      output.innerHTML += `<span class="out-line">${escapeHtml(text)}</span>\n`;
    });

    if (result.result !== null && result.result !== undefined) {
      output.innerHTML += `<span class="out-result">${escapeHtml(result.result)}</span>\n`;
    }
    if (result.error) {
      output.innerHTML += `<span class="out-error">Error: ${escapeHtml(result.error)}</span>\n`;
    }
    if (!output.innerHTML) output.innerHTML = '<span class="out-info">No output.</span>';
  } catch (e) {
    output.innerHTML += `<span class="out-error">Error: ${escapeHtml(String(e))}</span>\n`;
  }

  status.textContent = `Evaluated in ${(performance.now() - start).toFixed(0)}ms`;
}

function resetSession() {
  Allegro.reset();
  output.innerHTML = '<span class="out-info">Session reset.</span>';
  status.textContent = 'Session reset';
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// --- Keyboard shortcuts ---

editor.addEventListener('keydown', (e) => {
  // Ctrl+Enter / Cmd+Enter — run
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runCode();
  }

  // Tab — insert spaces
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 4;
  }
});
