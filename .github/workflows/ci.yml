# CI (B-005): typecheck + full test suite on every push and PR.
# The test suite is the landing gate — it includes the boundary-test
# harness (lint ratchet, invariant walks, registry completeness), the
# doc-reference lint, and the .alg file corpus.
name: CI

on:
  # `push:` alone fired for BOTH events on a same-repo PR branch, so every
  # PR ran the full gate twice on the same commit. Restricting push to the
  # default branch keeps main covered while PR branches are covered once,
  # by `pull_request`.
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight for the same ref; the older one
# is answering a question nobody is asking any more. Never cancels main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits: on a pull_request event HEAD is the PR's merge
          # commit, and its first parent is the base tip, so the lane check
          # below diffs `HEAD^1...HEAD` — exactly the PR's files.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lane check (B-163) — the PR's files stay inside its lane
        if: github.event_name == 'pull_request'
        env:
          # Through env, never interpolated into the script: a title is
          # untrusted text.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: npm run lint:lanes -- --base HEAD^1
      - name: Fetch methodology-tools (B-173) — the IR checks run from a checkout
        # `mtool ir check` is not published as a package; its node_modules
        # are committed, so a shallow clone is the whole install.
        run: git clone --quiet --depth 1 https://github.com/majodali/methodology-tools "$RUNNER_TEMP/methodology-tools"
      - name: IR lint (B-173) — every IR passes the methodology's checks
        env:
          MTOOL_HOME: ${{ runner.temp }}/methodology-tools
        run: npm run lint:ir
      - name: Typecheck (sanctioned invocation)
        run: bash scripts/typecheck.sh
      - name: Test suite (full landing gate, sharded)
        # Same 1197 tests, run as N processes with the gate applied to the
        # aggregate (scripts/test-shards.mjs). `npm test` remains the
        # sequential entry point for local work.
        env:
          MTOOL_HOME: ${{ runner.temp }}/methodology-tools
        run: npm run test:shards
